name: Build and Package Wheels

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  compute_version:
    name: Compute Package Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      env: ${{ steps.version.outputs.env }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            # Tag scenario
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"  # Strip 'v' prefix

            if [[ "$VERSION" == *"rc"* ]]; then
              echo "env=staging" >> $GITHUB_OUTPUT
            else
              echo "env=prod" >> $GITHUB_OUTPUT
            fi
          else
            # Push to main scenario - create dev version
            LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            BASE="${LAST_TAG#v}"
            TIMESTAMP=$(date +%s)

            if [[ "$BASE" == *"rc"* ]]; then
              # Last tag was RC - increment RC number, add .dev
              RC_NUM=$(echo "$BASE" | sed -E 's/.*rc([0-9]+).*/\1/')
              VERSION_BASE=$(echo "$BASE" | sed -E 's/rc[0-9]+.*//')
              NEXT_RC=$((RC_NUM + 1))
              VERSION="${VERSION_BASE}rc${NEXT_RC}.dev${TIMESTAMP}"
            else
              # Last tag was release - bump patch, add .dev
              IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
              NEXT_PATCH=$((PATCH + 1))
              VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}.dev${TIMESTAMP}"
            fi

            echo "env=dev" >> $GITHUB_OUTPUT
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Computed version: $VERSION"

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install ruff
        run: pip install ruff

      - name: Run linting
        run: |
          echo "Running Ruff linter..."
          ruff check . --output-format=github
          echo "Checking code formatting..."
          ruff format --check .

  test:
    runs-on: ubuntu-latest
    needs: [lint, compute_version]
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout SDK code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TOKEN }}
          CYBORGDB_API_KEY: "op://CyborgDB/CyborgDB ${{ needs.compute_version.outputs.env == 'dev' && 'Dev' || needs.compute_version.outputs.env == 'staging' && 'Staging' || 'Prod' }}/CYBORGDB_API_KEY_STANDARD"

      - name: Load CodeArtifact account ID from 1Password
        if: needs.compute_version.outputs.env != 'prod'
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TOKEN }}
          CA_AWS_ACCOUNT_ID: "op://CyborgDB/CyborgDB ${{ needs.compute_version.outputs.env == 'dev' && 'Dev' || 'Staging' }}/CA_AWS_ACCOUNT_ID"

      - name: Get CodeArtifact pip index URL
        if: needs.compute_version.outputs.env != 'prod'
        id: ca-url
        uses: ./.github/workflows/actions/codeartifact-pip-url
        with:
          aws-account-id: ${{ env.CA_AWS_ACCOUNT_ID }}
          role-to-assume: arn:aws:iam::${{ env.CA_AWS_ACCOUNT_ID }}:role/CyborgGitHubActionsS3Role
          codeartifact-repository: ${{ needs.compute_version.outputs.env == 'dev' && 'cyborg-dev' || 'cyborg-staging' }}

      - name: Export PIP_INDEX_URL
        if: needs.compute_version.outputs.env != 'prod'
        run: echo "PIP_INDEX_URL=${{ steps.ca-url.outputs.pip-index-url }}" >> $GITHUB_ENV

      - name: Install cyborgdb-service
        run: |
          # Install CPU-only torch
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Install optional test dependencies
          pip install sentence-transformers
          # For dev/staging, PIP_INDEX_URL points at CodeArtifact (PyPI upstream).
          # For prod, it is unset and pip falls back to PyPI.
          pip install "cyborgdb-service[embeddings]" --pre

      - name: Install SDK and test dependencies
        run: |
          pip install '.[langchain]'
          pip install pytest pytest-cov pytest-asyncio

      - name: Test
        run: |
          echo "=== Running Tests with local CyborgDB Service ==="
          # Set up environment for Standard
          export CYBORGDB_DB_TYPE=disk
          export CYBORGDB_SERVICE_LOG_LEVEL=DEBUG

          # Start the service
          nohup cyborgdb-service > server-standard.log 2>&1 &
          echo $! > server-standard.pid

          # Wait for service to be ready
          for i in {1..30}; do
            if curl -fs http://localhost:8000/v1/health > /dev/null; then
              echo "Standard service is up!"
              break
            fi
            sleep 1
          done

          if ! curl -fs http://localhost:8000/v1/health > /dev/null; then
            echo "Standard service failed to start"
            cat server-standard.log
            exit 1
          fi

          # Run all tests
          pytest tests/ -v --cov=cyborgdb --cov-report=term-missing --cov-append --ignore=tests/test_api_contract.py

          # Store the server pid for later cleanup
          echo "Standard server PID: $(cat server-standard.pid)"

      - name: Check API Contract
        run: |
          echo "=== Checking API Contract ==="
          # Run the API contract test separately to avoid affecting coverage of other tests
          pytest tests/test_api_contract.py -v

      - name: Kill Server
        run: |
          if [ -f server-standard.pid ]; then
            kill $(cat server-standard.pid) || true
          fi

      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  build_distributions:
    needs: [compute_version, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: ${{ needs.compute_version.outputs.env }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Write version file
        run: |
          echo '__version__ = "${{ needs.compute_version.outputs.version }}"' > cyborgdb/_version.py
          cat cyborgdb/_version.py

      - name: Set Version for Build
        run: |
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=${{ needs.compute_version.outputs.version }}" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build wheel

      - name: Build distributions
        run: |
          python -m build --sdist --wheel --outdir dist/
          echo "Built distributions:"
          ls -la dist/

      - name: Verify installed version matches
        run: |
          pip install dist/*.whl
          INSTALLED_VERSION=$(python -c "import cyborgdb; print(cyborgdb.__version__)")
          echo "Expected: $SETUPTOOLS_SCM_PRETEND_VERSION"
          echo "Got:      $INSTALLED_VERSION"
          [ "$INSTALLED_VERSION" = "$SETUPTOOLS_SCM_PRETEND_VERSION" ] || { echo "Version mismatch!"; exit 1; }

      - name: Store distributions as artifact
        uses: actions/upload-artifact@v7
        with:
          name: cyborgdb-dist
          path: dist/*
          retention-days: 5
  
  publish_to_pypi:
    needs: [compute_version, build_distributions]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && needs.compute_version.outputs.env == 'prod'
    environment:
      name: prod
    permissions:
      id-token: write
      contents: write
    
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: cyborgdb-dist
          path: dist
          
      - name: Display structure of downloaded files
        run: ls -la dist/
          
      - name: Create release archive
        run: |
          VERSION="${{ needs.compute_version.outputs.version }}"
          echo "Creating archive for version $VERSION"
          zip -r cyborgdb-${VERSION}-dist.zip dist/
          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            cyborgdb-${{ env.RELEASE_VERSION }}-dist.zip
          generate_release_notes: true
          draft: false
          tag_name: ${{ github.ref_name }}
          
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  upload_to_codeartifact:
    needs: [compute_version, build_distributions]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (needs.compute_version.outputs.env == 'dev' || needs.compute_version.outputs.env == 'staging')
    environment:
      name: ${{ needs.compute_version.outputs.env }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: cyborgdb-dist
          path: dist

      - name: Display structure of downloaded files
        run: ls -la dist/

      - name: Setup Python for Publishing
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Load CodeArtifact account ID from 1Password
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TOKEN }}
          CA_AWS_ACCOUNT_ID: "op://CyborgDB/CyborgDB ${{ needs.compute_version.outputs.env == 'dev' && 'Dev' || 'Staging' }}/CA_AWS_ACCOUNT_ID"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.CA_AWS_ACCOUNT_ID }}:role/CyborgGitHubActionsS3Role
          aws-region: us-east-1

      - name: Get CodeArtifact token
        run: |
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain cyborg \
            --domain-owner ${{ env.CA_AWS_ACCOUNT_ID }} \
            --query authorizationToken \
            --output text)
          echo "::add-mask::$TOKEN"
          echo "CA_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Install twine
        run: pip install --upgrade "twine>=6.2.0" "packaging>=24.2"

      - name: Upload to CodeArtifact
        env:
          CA_REPO: ${{ needs.compute_version.outputs.env == 'dev' && 'cyborg-dev' || 'cyborg-staging' }}
        run: |
          twine upload --verbose \
            --repository-url "https://cyborg-${{ env.CA_AWS_ACCOUNT_ID }}.d.codeartifact.us-east-1.amazonaws.com/pypi/${CA_REPO}/" \
            --username aws \
            --password "$CA_TOKEN" \
            dist/*
