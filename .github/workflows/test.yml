name: Test CyborgDB Python SDK
permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          
      - name: Install ruff
        run: pip install ruff
        
      - name: Run linting
        run: |
          echo "Running Ruff linter..."
          ruff check . --output-format=github
          echo "Checking code formatting..."
          ruff format --check .

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout SDK code
        uses: actions/checkout@v6
        
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TOKEN }}
          CYBORGDB_API_KEY: "op://CyborgDB/CyborgDB Dev/CYBORGDB_API_KEY"

      - name: Load CodeArtifact account ID from 1Password
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TOKEN }}
          CA_AWS_ACCOUNT_ID: "op://CyborgDB/CyborgDB Dev/CA_AWS_ACCOUNT_ID"

      # BYOK creds for the KMS registry slots committed in cyborgdb-service's
      # cyborgdb.yaml (aws-kms-self-test / aws-secrets-self-test). export-env is
      # false so these AWS creds stay out of the job/pytest env and are scoped to
      # the service-start env block below, mirroring cyborgdb-service e2e-test.yml.
      - name: Load BYOK secrets from 1Password
        id: byok
        uses: 1password/load-secrets-action@v4
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TOKEN }}
          BYOK_AWS_ACCESS_KEY_ID: "op://CyborgDB/CyborgDB Dev/BYOK_AWS_ACCESS_KEY_ID"
          BYOK_AWS_SECRET_ACCESS_KEY: "op://CyborgDB/CyborgDB Dev/BYOK_AWS_SECRET_ACCESS_KEY"
          CYBORGDB_BYOK_ROLE_ARN: "op://CyborgDB/CyborgDB Dev/CYBORGDB_BYOK_ROLE_ARN"
          CYBORGDB_BYOK_EXTERNAL_ID: "op://CyborgDB/CyborgDB Dev/CYBORGDB_BYOK_EXTERNAL_ID"

      - name: Get CodeArtifact pip index URL
        id: ca-url
        uses: ./.github/workflows/actions/codeartifact-pip-url
        with:
          aws-account-id: ${{ env.CA_AWS_ACCOUNT_ID }}
          role-to-assume: arn:aws:iam::${{ env.CA_AWS_ACCOUNT_ID }}:role/CyborgGitHubActionsS3Role
          codeartifact-repository: cyborg-dev

      - name: Export PIP_INDEX_URL
        run: echo "PIP_INDEX_URL=${{ steps.ca-url.outputs.pip-index-url }}" >> $GITHUB_ENV

      - name: Checkout cyborgdb-service repository
        uses: actions/checkout@v6
        with:
          repository: cyborginc/cyborgdb-service
          ref: main
          path: cyborgdb-service
          token: ${{ secrets.CYBORGDB_SERVICE_TOKEN }}
          
      - name: Install service dependencies
        run: |
          # Install CPU-only torch
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Install optional test dependencies
          pip install sentence-transformers
          
      - name: Install cyborgdb-service from source
        run: |
          # Install the server from the cloned repository.
          # PIP_INDEX_URL points at CodeArtifact (PyPI upstream), so dependencies
          # in the private index resolve automatically.
          pip install './cyborgdb-service[kms-aws]'
          
      - name: Install SDK and test dependencies
        run: |
          pip install '.[langchain]'
          pip install pytest pytest-cov pytest-asyncio

      - name: Test
        env:
          # KMS slot names the SDK's test_kms_byok.py gates on — they name the
          # registry slots committed in cyborgdb-service/cyborgdb.yaml.
          CYBORGDB_KMS_NAME_REAL: aws-kms-self-test
          CYBORGDB_KMS_NAME_SM: aws-secrets-self-test
          # Point the service at the committed registry config.
          CYBORGDB_CONFIG_FILE: ${{ github.workspace }}/cyborgdb-service/cyborgdb.yaml
          # Static BYOK creds the slots' role_arn/external_id are assumed with.
          AWS_ACCESS_KEY_ID: ${{ steps.byok.outputs.BYOK_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.byok.outputs.BYOK_AWS_SECRET_ACCESS_KEY }}
          CYBORGDB_BYOK_ROLE_ARN: ${{ steps.byok.outputs.CYBORGDB_BYOK_ROLE_ARN }}
          CYBORGDB_BYOK_EXTERNAL_ID: ${{ steps.byok.outputs.CYBORGDB_BYOK_EXTERNAL_ID }}
        run: |
          echo "=== Running Tests with local CyborgDB Service ==="
          # The static BYOK key must not be combined with the OIDC session token
          # left in the env by the CodeArtifact step — that would assume the wrong
          # principal when the service tries to reach KMS / Secrets Manager.
          unset AWS_SESSION_TOKEN
          # Set up environment for Standard
          export CYBORGDB_DB_TYPE=disk
          export CYBORGDB_SERVICE_LOG_LEVEL=DEBUG

          # Start the service
          nohup cyborgdb-service > server-standard.log 2>&1 &
          echo $! > server-standard.pid
          
          # Wait for service to be ready
          for i in {1..30}; do
            if curl -fs http://localhost:8000/v1/health > /dev/null; then
              echo "Standard service is up!"
              break
            fi
            sleep 1
          done
          
          if ! curl -fs http://localhost:8000/v1/health > /dev/null; then
            echo "Standard service failed to start"
            cat server-standard.log
            exit 1
          fi
          
          # Run all tests
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            pytest tests/quick_flow_test.py tests/test_kms_byok.py -v --cov=cyborgdb --cov-report=term-missing --cov-append
          else
            pytest tests/ -v --cov=cyborgdb --cov-report=term-missing --cov-append --ignore=tests/test_api_contract.py
          fi
          
          # Store the server pid for later cleanup
          echo "Standard server PID: $(cat server-standard.pid)"

      - name: Check API Contract
        if: always()
        run: |
          echo "=== Checking API Contract ==="
          # Run the API contract test separately to avoid affecting coverage of other tests
          pytest tests/test_api_contract.py -v

      - name: Kill Server
        if: always()
        run: |
          if [ -f server-standard.pid ]; then
            kill $(cat server-standard.pid) || true
          fi
          
      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true