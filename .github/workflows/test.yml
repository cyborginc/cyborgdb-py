name: Test CyborgDB Python SDK
permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          
      - name: Install ruff
        run: pip install ruff
        
      - name: Run linting
        run: |
          echo "Running Ruff linter..."
          ruff check . --output-format=github
          echo "Checking code formatting..."
          ruff format --check .

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout SDK code
        uses: actions/checkout@v7
        
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TOKEN }}
          CYBORGDB_API_KEY: "op://CyborgDB/CyborgDB Dev/CYBORGDB_API_KEY"

      - name: Load CodeArtifact account ID from 1Password
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TOKEN }}
          CA_AWS_ACCOUNT_ID: "op://CyborgDB/CyborgDB Dev/CA_AWS_ACCOUNT_ID"

      # BYOK creds for the KMS registry slots written by the "Write KMS registry
      # config" step below (aws-kms-self-test / aws-secrets-self-test). export-env is
      # false so these AWS creds stay out of the job/pytest env and are scoped to
      # the service-start env block below, mirroring cyborgdb-service e2e-test.yml.
      - name: Load BYOK secrets from 1Password
        id: byok
        uses: 1password/load-secrets-action@v4
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TOKEN }}
          BYOK_AWS_ACCESS_KEY_ID: "op://CyborgDB/CyborgDB Dev/BYOK_AWS_ACCESS_KEY_ID"
          BYOK_AWS_SECRET_ACCESS_KEY: "op://CyborgDB/CyborgDB Dev/BYOK_AWS_SECRET_ACCESS_KEY"
          CYBORGDB_BYOK_ROLE_ARN: "op://CyborgDB/CyborgDB Dev/CYBORGDB_BYOK_ROLE_ARN"
          CYBORGDB_BYOK_EXTERNAL_ID: "op://CyborgDB/CyborgDB Dev/CYBORGDB_BYOK_EXTERNAL_ID"

      - name: Get CodeArtifact pip index URL
        id: ca-url
        uses: ./.github/workflows/actions/codeartifact-pip-url
        with:
          aws-account-id: ${{ env.CA_AWS_ACCOUNT_ID }}
          role-to-assume: arn:aws:iam::${{ env.CA_AWS_ACCOUNT_ID }}:role/CyborgGitHubActionsS3Role
          codeartifact-repository: cyborg-dev

      - name: Export PIP_INDEX_URL
        run: echo "PIP_INDEX_URL=${{ steps.ca-url.outputs.pip-index-url }}" >> $GITHUB_ENV

      # The KMS registry the BYOK tests need. cyborgdb-service keeps an
      # equivalent file committed at its repo root, but this repo is public, so
      # it is generated here instead. Contains no secrets: every sensitive value
      # is a ${VAR} placeholder the service expands from the env at startup, and
      # those come from 1Password in the byok step above. The quoted heredoc
      # delimiter keeps bash from expanding the placeholders.
      - name: Write KMS registry config
        run: |
          set -euo pipefail
          cat > "${{ runner.temp }}/cyborgdb.yaml" <<'YAML'
          kms:
            registry:
              # BYOK via AWS Secrets Manager — the wrap key lives in Secrets
              # Manager; service AES-GCM-encrypts each per-index KEK under it.
              aws-secrets-self-test:
                provider:    aws
                key_id:      ${CYBORGDB_SECRETS_KEY_ID:-CYBORGDB_SERVICE_KEY1}
                region:      ${CYBORGDB_AWS_REGION:-us-east-1}
                role_arn:    ${CYBORGDB_BYOK_ROLE_ARN}
                external_id: ${CYBORGDB_BYOK_EXTERNAL_ID}
                role_session_name: cyborgdb-secrets-self-test

              # BYOK via AWS KMS (HSM) — the wrap key never leaves the HSM;
              # `kms:Encrypt` returns ciphertext directly.
              aws-kms-self-test:
                provider:    aws-kms
                key_id:      ${CYBORGDB_KMS_KEY_ID:-alias/CYBORGDB_SERVICE_KEY}
                region:      ${CYBORGDB_AWS_REGION:-us-east-1}
                role_arn:    ${CYBORGDB_BYOK_ROLE_ARN}
                external_id: ${CYBORGDB_BYOK_EXTERNAL_ID}
                role_session_name: cyborgdb-kms-self-test
          YAML
          echo "--- generated registry (placeholders unexpanded) ---"
          cat "${{ runner.temp }}/cyborgdb.yaml"

      - name: Install service dependencies
        run: |
          # Install CPU-only torch so the [embeddings] extra below does not pull
          # the much larger CUDA build.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          
      - name: Install cyborgdb-service
        run: |
          # PIP_INDEX_URL points at CodeArtifact (PyPI upstream), so the private
          # pre-release resolves from there. Matches the cyborgdb-js and
          # cyborgdb-go SDK workflows.
          pip install "cyborgdb-service[embeddings,kms-aws]" --pre
          
      - name: Install SDK and test dependencies
        id: install-sdk
        run: |
          pip install '.[langchain]'
          pip install pytest pytest-cov pytest-asyncio

      - name: Test
        env:
          # KMS slot names the SDK's test_kms_byok.py gates on — they name the
          # registry slots written by the "Write KMS registry config" step.
          CYBORGDB_KMS_NAME_REAL: aws-kms-self-test
          CYBORGDB_KMS_NAME_SM: aws-secrets-self-test
          # Point the service at that generated registry.
          CYBORGDB_CONFIG_FILE: ${{ runner.temp }}/cyborgdb.yaml
          # Static BYOK creds the slots' role_arn/external_id are assumed with.
          AWS_ACCESS_KEY_ID: ${{ steps.byok.outputs.BYOK_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.byok.outputs.BYOK_AWS_SECRET_ACCESS_KEY }}
          CYBORGDB_BYOK_ROLE_ARN: ${{ steps.byok.outputs.CYBORGDB_BYOK_ROLE_ARN }}
          CYBORGDB_BYOK_EXTERNAL_ID: ${{ steps.byok.outputs.CYBORGDB_BYOK_EXTERNAL_ID }}
        run: |
          echo "=== Running Tests with local CyborgDB Service ==="
          # The static BYOK key must not be combined with the OIDC session token
          # left in the env by the CodeArtifact step — that would assume the wrong
          # principal when the service tries to reach KMS / Secrets Manager.
          unset AWS_SESSION_TOKEN
          # Set up environment for Standard
          export CYBORGDB_DB_TYPE=disk
          export CYBORGDB_SERVICE_LOG_LEVEL=DEBUG

          # Start the service
          nohup cyborgdb-service > server-standard.log 2>&1 &
          echo $! > server-standard.pid
          
          # Wait for service to be ready
          for i in {1..30}; do
            if curl -fs http://localhost:8000/v1/health > /dev/null; then
              echo "Standard service is up!"
              break
            fi
            sleep 1
          done
          
          if ! curl -fs http://localhost:8000/v1/health > /dev/null; then
            echo "Standard service failed to start"
            cat server-standard.log
            exit 1
          fi
          
          # Run the full test suite on every trigger (PRs and main).
          # test_api_contract.py runs separately in the next step so it does not
          # affect the coverage of the other tests.
          pytest tests/ -v --cov=cyborgdb --cov-report=term-missing --cov-append --ignore=tests/test_api_contract.py
          
          # Store the server pid for later cleanup
          echo "Standard server PID: $(cat server-standard.pid)"

      - name: Check API Contract
        if: ${{ !cancelled() && steps.install-sdk.outcome == 'success' }}
        run: |
          echo "=== Checking API Contract ==="
          # Run the API contract test separately to avoid affecting coverage of other tests
          pytest tests/test_api_contract.py -v

      - name: Kill Server
        if: always()
        run: |
          if [ -f server-standard.pid ]; then
            kill $(cat server-standard.pid) || true
          fi
          
      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true