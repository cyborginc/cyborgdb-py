name: Test CyborgDB Python SDK
permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          
      - name: Install ruff
        run: pip install ruff
        
      - name: Run linting
        run: |
          echo "Running Ruff linter..."
          ruff check . --output-format=github
          echo "Checking code formatting..."
          ruff format --check .

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout SDK code
        uses: actions/checkout@v7
        
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TOKEN }}
          CYBORGDB_API_KEY: "op://CyborgDB/CyborgDB Dev/CYBORGDB_API_KEY"

      - name: Load CodeArtifact account ID from 1Password
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TOKEN }}
          CA_AWS_ACCOUNT_ID: "op://CyborgDB/CyborgDB Dev/CA_AWS_ACCOUNT_ID"

      - name: Get CodeArtifact pip index URL
        id: ca-url
        uses: ./.github/workflows/actions/codeartifact-pip-url
        with:
          aws-account-id: ${{ env.CA_AWS_ACCOUNT_ID }}
          role-to-assume: arn:aws:iam::${{ env.CA_AWS_ACCOUNT_ID }}:role/CyborgGitHubActionsS3Role
          codeartifact-repository: cyborg-dev

      - name: Export PIP_INDEX_URL
        run: echo "PIP_INDEX_URL=${{ steps.ca-url.outputs.pip-index-url }}" >> $GITHUB_ENV

      - name: Install service dependencies
        run: |
          # Install CPU-only torch
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Install optional test dependencies
          pip install sentence-transformers

      - name: Install cyborgdb-service
        run: |
          # Install the server from the package index. PIP_INDEX_URL points at
          # CodeArtifact (PyPI upstream), so the pre-release service resolves there.
          pip install "cyborgdb-service[kms-aws]" --pre
          
      - name: Install SDK and test dependencies
        run: |
          pip install '.[langchain]'
          pip install pytest pytest-cov pytest-asyncio

      - name: Test
        run: |
          echo "=== Running Tests with local CyborgDB Service ==="
          # Set up environment for Standard
          export CYBORGDB_DB_TYPE=disk
          export CYBORGDB_SERVICE_LOG_LEVEL=DEBUG

          # Start the service
          nohup cyborgdb-service > server-standard.log 2>&1 &
          echo $! > server-standard.pid
          
          # Wait for service to be ready
          for i in {1..30}; do
            if curl -fs http://localhost:8000/v1/health > /dev/null; then
              echo "Standard service is up!"
              break
            fi
            sleep 1
          done
          
          if ! curl -fs http://localhost:8000/v1/health > /dev/null; then
            echo "Standard service failed to start"
            cat server-standard.log
            exit 1
          fi
          
          # Run the full test suite on every trigger (PRs and main).
          # test_api_contract.py runs separately in the next step so it does not
          # affect the coverage of the other tests.
          pytest tests/ -v --cov=cyborgdb --cov-report=term-missing --cov-append --ignore=tests/test_api_contract.py
          
          # Store the server pid for later cleanup
          echo "Standard server PID: $(cat server-standard.pid)"

      - name: Check API Contract
        if: always()
        run: |
          echo "=== Checking API Contract ==="
          # Run the API contract test separately to avoid affecting coverage of other tests
          pytest tests/test_api_contract.py -v

      - name: Kill Server
        if: always()
        run: |
          if [ -f server-standard.pid ]; then
            kill $(cat server-standard.pid) || true
          fi
          
      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true